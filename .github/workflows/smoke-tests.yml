name: Smoke Tests (PROD)

# Fires when Vercel completes a Production deployment.
# Runs L1+L2+L3 smoke suite from tests/smoke/ against the live prod URL.
# Walker-wide standard codified 2026-05-11. See:
#   - ~/.claude/rules/behavioral/walker-engineering.md
#   - memory/project_walker_deep_prod_test_pattern.md

on:
  deployment_status:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against prod
        run: npx playwright test
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.deployment_status.target_url }}
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-playwright-report
          path: playwright-report/
          retention-days: 7
